version: "3.8"
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_kernel
    ports:
      - "5432:5432"
    volumes:
      - erp_pg_data:/var/lib/postgresql/data

volumes:
  erp_pg_data:
